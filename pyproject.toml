[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mitcfu-rag"
version = "0.1.0"
description = "Chatbot to MitCFU"
requires-python = ">= 3.11"
maintainers = [
    { name = "ai", email = "ai@dbc.dk" }
]
dependencies = [
    "dbc-data",
    "langchain",
    "langchain-text-splitters",
    "langchain-community",
    "langchain-unstructured",
    "langgraph",
    "streamlit",
    "scikit-learn",
    "numpy",
    "nltk",
    "sentence_transformers",
    "rich",
    "transformers",
    "torch",
    "dbc_pyutils",
    "tornado",
    "pydantic",
    "aiohttp",
    "requests",
    "tokenizers",
    "accelerate",
    "faiss-cpu>=1.14.2",
    "jq",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
    "pip-audit",
]

[project.scripts]
create-faiss-index = "mitcfu_rag.rag.index_vector_db:main"
mitcfu-RAG-sh = "mitcfu_rag.term_ui:cli"
evaluate = "mitcfu_rag.evaluation_tools.evaluation:run"
evaluate-retrieval = "mitcfu_rag.evaluation_tools.evaluate_retrieval:run"
compare-retrievers = "mitcfu_rag.evaluation_tools.compare_retrievers:run"
streaming-service-mitcfu = "mitcfu_rag.service:cli"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mitcfu_rag.evaluation_tool" = ["evaluation_tool/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[[tool.uv.index]]
name = "dbc-devpi"
url = "https://devpi.dbccloud.dk/dbc/packages/+simple/"
publish-url = "https://devpi.dbccloud.dk/dbc/packages"
